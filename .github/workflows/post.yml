name: post
on:
  schedule:
    # ONE generation run builds all of the day's clips and hands them to
    # YouTube's own scheduler (publishAt), so GitHub cron only has to fire once.
    # Two later checks catch up if the morning run was dropped. Times are UTC.
    # Six batches a day, 3 slots each = 18 of capacity for 11 slots. Any run
    # that fails is absorbed by the next batch, which measures the gap from
    # videos actually posted rather than from run status. Times are UTC.
    - cron: "0 9 * * *"     # ~5:00a EDT
    - cron: "0 12 * * *"    # ~8:00a EDT
    - cron: "0 15 * * *"    # ~11:00a EDT
    - cron: "0 18 * * *"    # ~2:00p EDT
    - cron: "0 21 * * *"    # ~5:00p EDT
    - cron: "0 0 * * *"     # ~8:00p EDT
  workflow_dispatch:
    inputs:
      fill_day:
        description: "schedule the whole day (true) or post one now (false)"
        default: "true"
      privacy:
        description: "one-off privacy when fill_day=false"
        default: "public"
      max:
        description: "most slots to fill in this run (0 = all remaining)"
        default: "3"

concurrency:
  group: post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check for private data
        run: python check_private.py
      - name: install ffmpeg + fonts
        # The runner image usually ships both already. Only touch apt when
        # something is genuinely missing: an `apt-get update` against a slow
        # mirror has stalled this step for 15+ minutes before now.
        timeout-minutes: 6
        run: |
          need=""
          command -v ffmpeg >/dev/null || need="$need ffmpeg"
          fc-list 2>/dev/null | grep -qi liberation || need="$need fonts-liberation"
          if [ -z "$need" ]; then
            echo "ffmpeg and fonts already present:"
            ffmpeg -version | head -1
            exit 0
          fi
          echo "installing:$need"
          sudo apt-get update -qq
          sudo apt-get install -y -qq $need
      - name: install python deps
        run: pip install -q -r requirements.txt
      - name: write secrets
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
      - name: build and schedule the day
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X264_PRESET: fast
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event.inputs.fill_day }}" = "false" ]; then
            python make_clip.py --privacy "${{ github.event.inputs.privacy || 'public' }}"
          else
            python make_clip.py --fill-day --max "${{ github.event.inputs.max || '3' }}"
          fi
      - name: persist state
        if: always()
        # This step MUST land. state.json is what stops a clip being uploaded
        # twice, so a failed persist means a duplicate video on the channel —
        # which has happened. A rebase treats two runs appending to the same
        # append-only file as a conflict, so take the union instead and retry
        # against whatever the remote moved to.
        run: |
          git config user.name "autopost"
          git config user.email "actions@users.noreply.github.com"
          # Keep this run's own results outside the work tree, so resetting
          # onto the remote tip cannot throw them away.
          mkdir -p /tmp/persist/logs
          cp state.json /tmp/persist/state.json 2>/dev/null || true
          cp logs/history.csv /tmp/persist/logs/history.csv 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/persist/state.json state.json 2>/dev/null || true
            cp /tmp/persist/logs/history.csv logs/history.csv 2>/dev/null || true
            python merge_state.py origin/main
            git add state.json logs/history.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "nothing new to persist"
              exit 0
            fi
            git commit -q -m "state: $(date -u +%Y-%m-%d\ %H:%M) UTC [skip ci]"
            if git push -q origin HEAD:main; then
              echo "persisted on attempt $attempt"
              exit 0
            fi
            echo "push raced with another run; retrying"
          done
          echo "::error::could not persist state after 5 attempts"
          exit 1
